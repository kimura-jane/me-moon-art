<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>メタマップ・ドット開封デモ（15パネル）</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <style>
    :root {
      --bg: #050608;
      --panel-bg: #101218;
      --accent: #f0b90b;
      --accent-soft: rgba(240,185,11,0.15);
      --text-main: #f9fafb;
      --text-sub: #9ca3af;
      --border-subtle: #1f2933;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
      color: var(--text-main);
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid #111827;
      backdrop-filter: blur(12px);
      background: linear-gradient(90deg, rgba(15,23,42,0.95), rgba(15,23,42,0.85));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }
    header .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--accent-soft);
      color: var(--accent);
      background: rgba(15,23,42,0.9);
    }
    header .info {
      font-size: 11px;
      color: var(--text-sub);
    }

    .layout {
      flex: 1;
      display: flex;
      gap: 8px;
      padding: 8px;
      min-height: 0;
    }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
    }

    /* 左：15パネル全体 */
    .board-panel {
      flex: 2;
      min-width: 0;
      border-radius: 16px;
      border: 1px solid #111827;
      background: radial-gradient(circle at top, #020617 0, #020617 60%, #000 100%);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-sub);
    }
    .board-viewport {
      position: relative;
      flex: 1;
      min-height: 260px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      overflow: auto;
      background: #000;
      padding: 8px;
    }
    .board-scale-wrapper {
      transform-origin: top left;
      transition: transform .15s ease-out;
      display: inline-block;
    }
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }

    /* 各パネル（1枚の画像＋ドット） */
    .image-panel {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background-image: url("onigiri_truck_square.png"); /* ←同じフォルダに置く */
      background-size: cover;
      background-position: center;
      aspect-ratio: 1 / 1;
      box-shadow: 0 8px 16px rgba(0,0,0,0.35);
    }
    .image-panel::after {
      /* 上にうっすらガラスっぽいフィルム */
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(15,23,42,0.5), rgba(15,23,42,0.85));
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .dot-block-grid {
      position: absolute;
      inset: 0;
      display: grid;
    }
    .dot-cell {
      position: relative;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    .dot-cell::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 999px;
      background: radial-gradient(circle at top, rgba(15,23,42,0.98), rgba(6,8,15,0.98));
      box-shadow:
        0 0 0 1px rgba(15,23,42,0.95),
        0 0 0 2px rgba(0,0,0,0.8);
      transition: opacity .15s ease-out, transform .1s ease-out;
    }
    .dot-cell:hover::before {
      transform: scale(1.05);
    }
    .dot-cell.opened {
      cursor: default;
    }
    .dot-cell.opened::before {
      opacity: 0;
      pointer-events: none;
    }

    .zoom-controls {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .zoom-button {
      border: 1px solid #1f2937;
      background: rgba(15,23,42,0.9);
      border-radius: 999px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-main);
    }
    .zoom-button:hover {
      border-color: var(--accent-soft);
      background: rgba(15,23,42,1);
    }
    .zoom-label {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(148,163,184,0.2);
      font-size: 11px;
      color: var(--text-sub);
    }

    /* 右：チャージUI */
    .control-panel {
      flex: 1.1;
      min-width: 260px;
      max-height: 100%;
      border-radius: 16px;
      border: 1px solid #111827;
      background: radial-gradient(circle at top, #020617 0, #020617 60%, #000 100%);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
    }
    .section {
      border-radius: 12px;
      border: 1px solid #111827;
      background: linear-gradient(145deg, rgba(15,23,42,0.96), rgba(15,23,42,0.9));
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .section-title { font-weight: 600; }
    .section-caption { font-size: 11px; color: var(--text-sub); }

    label {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 2px;
      display: block;
    }
    input[type="email"], input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      background: #020617;
      color: var(--text-main);
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: var(--accent-soft);
      box-shadow: 0 0 0 1px rgba(240,185,11,0.2);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary {
      background: radial-gradient(circle at top left, #fbbf24, #f59e0b);
      color: #111827;
      font-weight: 600;
      box-shadow: 0 8px 16px rgba(251,191,36,0.25);
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-outline {
      border-color: #1f2937;
      background: rgba(15,23,42,0.9);
      color: var(--text-main);
    }
    .btn-outline:hover {
      border-color: var(--accent-soft);
      background: rgba(15,23,42,1);
    }
    .btn-sm { padding: 4px 8px; font-size: 11px; }
    .btn:disabled { opacity: .5; cursor: default; box-shadow: none; }

    .charge-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .quota-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid #1f2937;
    }
    .quota-display strong {
      color: var(--accent);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .quota-display .status {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(55,65,81,0.8);
      background: rgba(15,23,42,0.95);
    }
    .quota-display .status.ok {
      border-color: rgba(34,197,94,0.7);
      color: #bbf7d0;
      background: rgba(22,163,74,0.12);
    }
    .quota-display .status.zero {
      border-color: rgba(239,68,68,0.7);
      color: #fecaca;
      background: rgba(239,68,68,0.08);
    }

    .hint { font-size: 11px; color: var(--text-sub); line-height: 1.5; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,0.98);
      border: 1px solid #1f2937;
      color: var(--text-sub);
      font-size: 11px;
      max-width: 90%;
      text-align: center;
      z-index: 50;
      display: none;
    }
    .toast.error {
      border-color: rgba(239,68,68,0.7);
      color: #fecaca;
    }
    .toast.show {
      display: block;
      animation: fadein .15s ease-out, fadeout .3s ease-in 2.3s forwards;
    }
    @keyframes fadein {
      from { opacity: 0; transform: translate(-50%,4px); }
      to   { opacity: 1; transform: translate(-50%,0); }
    }
    @keyframes fadeout {
      to { opacity: 0; transform: translate(-50%,6px); }
    }
  </style>
</head>
<body>
<header>
  <div class="title">
    META MAP DOTS
    <span class="badge">15 PANELS DEMO</span>
  </div>
  <div class="info">1枚の画像を、3×3〜6×6のドットで覆ったパネルを複数配置</div>
</header>

<div class="layout">
  <!-- 左：15パネル -->
  <section class="board-panel">
    <div class="board-header">
      <div>メタマップ（同じ画像をサイズ違いで15枚）</div>
      <div>タップでドット開封 / ズームで拡大縮小</div>
    </div>
    <div class="board-viewport">
      <div class="board-scale-wrapper" id="boardScaleWrapper">
        <div class="panel-grid" id="panelGrid"><!-- JSで生成 --></div>
      </div>

      <div class="zoom-controls">
        <button class="zoom-button" id="zoomInBtn">＋</button>
        <button class="zoom-button" id="zoomOutBtn">−</button>
        <button class="zoom-button" id="zoomResetBtn">⭯</button>
      </div>
      <div class="zoom-label">
        Zoom: <span id="zoomValue">1.0×</span>
      </div>
    </div>
  </section>

  <!-- 右：チャージUI -->
  <aside class="control-panel">
    <div class="section">
      <div class="section-header">
        <div class="section-title">チャージ（デモ）</div>
        <div class="section-caption">本番ではここを GAS の /charge に差し替え</div>
      </div>
      <div>
        <label for="emailInput">メールアドレス</label>
        <input id="emailInput" type="email" placeholder="example@mail.com" autocomplete="email">
      </div>
      <div>
        <label for="slugInput">slug（チケットコード）</label>
        <input id="slugInput" type="text" placeholder="campaign-xxx">
      </div>
      <div class="charge-row">
        <button class="btn btn-primary" id="chargeBtn">チャージ（+3ドット / デモ）</button>
        <button class="btn btn-outline btn-sm" id="resetBtn">残り回数リセット</button>
      </div>
      <div class="quota-display">
        <div>残り回数：<strong id="quotaRemaining">0</strong></div>
        <div class="status zero" id="quotaStatus">0回 / 見るだけ</div>
      </div>
      <div class="hint">
        今はフロントだけで <b>+3回</b> 増えるダミー実装。<br>
        後で、メール＋slugをスプシに投げて残り回数を管理する。
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
  // ===== パネル構成 =====
  // 3×3, 4×4, 5×5, 6×6 をぐるぐる回して 15枚
  const PANEL_CONFIGS = [];
  const sizes = [3, 4, 5, 6];
  for (let i = 0; i < 15; i++) {
    const s = sizes[i % sizes.length];
    PANEL_CONFIGS.push({
      id: "panel_" + i,
      cols: s,
      rows: s
    });
  }

  const MIN_ZOOM = 0.5;
  const MAX_ZOOM = 2.5;
  const ZOOM_STEP = 0.2;

  // 残り回数
  let zoomLevel = 1.0;
  let quotaTotal = 0;
  let quotaUsed  = 0;

  // パネルごとの開封状態
  const panelStates = {};
  PANEL_CONFIGS.forEach(cfg => {
    panelStates[cfg.id] = new Array(cfg.cols * cfg.rows).fill(false);
  });

  // DOM
  const panelGrid         = document.getElementById("panelGrid");
  const boardScaleWrapper = document.getElementById("boardScaleWrapper");
  const zoomValueEl       = document.getElementById("zoomValue");
  const zoomInBtn         = document.getElementById("zoomInBtn");
  const zoomOutBtn        = document.getElementById("zoomOutBtn");
  const zoomResetBtn      = document.getElementById("zoomResetBtn");
  const toastEl           = document.getElementById("toast");
  const quotaRemainingEl  = document.getElementById("quotaRemaining");
  const quotaStatusEl     = document.getElementById("quotaStatus");
  const emailInput        = document.getElementById("emailInput");
  const slugInput         = document.getElementById("slugInput");
  const chargeBtn         = document.getElementById("chargeBtn");
  const resetBtn          = document.getElementById("resetBtn");

  // ===== UI系 =====
  function showToast(msg, type = "info") {
    toastEl.textContent = msg;
    toastEl.classList.remove("error", "show");
    if (type === "error") toastEl.classList.add("error");
    void toastEl.offsetWidth;
    toastEl.classList.add("show");
  }

  function updateQuotaUI() {
    const remaining = quotaTotal - quotaUsed;
    quotaRemainingEl.textContent = remaining;
    if (remaining > 0) {
      quotaStatusEl.textContent = remaining + "回 / 開封OK";
      quotaStatusEl.classList.remove("zero");
      quotaStatusEl.classList.add("ok");
    } else {
      quotaStatusEl.textContent = "0回 / 見るだけモード";
      quotaStatusEl.classList.remove("ok");
      quotaStatusEl.classList.add("zero");
    }
  }

  function applyZoom() {
    boardScaleWrapper.style.transform = `scale(${zoomLevel})`;
    zoomValueEl.textContent = zoomLevel.toFixed(1) + "×";
  }
  function setZoom(v) {
    zoomLevel = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, v));
    applyZoom();
  }

  // ===== パネル生成 =====
  function createPanels() {
    const frag = document.createDocumentFragment();
    PANEL_CONFIGS.forEach(cfg => {
      const panel = document.createElement("div");
      panel.className = "image-panel";
      panel.dataset.panelId = cfg.id;

      const grid = document.createElement("div");
      grid.className = "dot-block-grid";
      grid.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
      grid.style.gridTemplateRows    = `repeat(${cfg.rows}, 1fr)`;

      const total = cfg.cols * cfg.rows;
      for (let i = 0; i < total; i++) {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "dot-cell";
        cell.dataset.panelId = cfg.id;
        cell.dataset.index   = String(i);
        cell.addEventListener("click", onDotClick);
        grid.appendChild(cell);
      }

      panel.appendChild(grid);
      frag.appendChild(panel);
    });
    panelGrid.appendChild(frag);
  }

  // ===== ドットクリック =====
  function onDotClick(e) {
    const btn = e.currentTarget;
    const panelId = btn.dataset.panelId;
    const idx     = Number(btn.dataset.index);

    const state = panelStates[panelId];
    if (!state || state[idx]) return; // 既に開封済み

    const remaining = quotaTotal - quotaUsed;
    if (remaining <= 0) {
      showToast("残り回数がありません。メール＋slugでチャージしてから開封して。", "error");
      return;
    }

    state[idx] = true;
    quotaUsed++;
    btn.classList.add("opened");
    updateQuotaUI();
    showToast("ドットを1つ開封しました。（残り " + (quotaTotal - quotaUsed) + "）");
  }

  // ===== イベント =====
  zoomInBtn.addEventListener("click", () => setZoom(zoomLevel + ZOOM_STEP));
  zoomOutBtn.addEventListener("click", () => setZoom(zoomLevel - ZOOM_STEP));
  zoomResetBtn.addEventListener("click", () => setZoom(1.0));

  chargeBtn.addEventListener("click", () => {
    const email = emailInput.value.trim();
    const slug  = slugInput.value.trim();
    if (!email || !slug) {
      showToast("メールアドレスとslugを入力して。", "error");
      return;
    }
    // 本番ではここで GAS の /charge を呼び出す
    quotaTotal += 3; // デモ：+3
    updateQuotaUI();
    showToast("デモ：3回分チャージしました。");
  });

  resetBtn.addEventListener("click", () => {
    quotaTotal = 0;
    quotaUsed  = 0;
    updateQuotaUI();
    showToast("残り回数をリセットしました。");
  });

  // ===== 初期化 =====
  function init() {
    createPanels();
    updateQuotaUI();
    applyZoom();
  }
  init();
</script>
</body>
</html>
